<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Clear Mirror — direct strategic reflection for AI agents</title>
  <desc id="desc">A dark blue social preview showing the three stages remember, create, and verify around a clear-eyed advisor for AI agents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.5" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d4ed8" stop-opacity="0"/>
      <stop offset=".5" stop-color="#2563eb" stop-opacity=".5"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1330" cy="120" r="260" fill="#1d4ed8" opacity=".14" filter="url(#glow)"/>
  <circle cx="220" cy="800" r="280" fill="#2563eb" opacity=".10" filter="url(#glow)"/>
  <path d="M80 165 H1520" stroke="#1e3a8a" stroke-width="2" opacity=".8"/>
  <path d="M80 730 H1520" stroke="#1e3a8a" stroke-width="2" opacity=".8"/>
  <g transform="translate(120 105)">
    <rect width="180" height="180" rx="48" fill="#030712" stroke="#2563eb" stroke-width="8"/>
    <circle cx="90" cy="82" r="55" fill="#0f172a" stroke="#334155" stroke-width="7"/>
    <path d="M90 27 A55 55 0 0 1 90 137 L90 82 Z" fill="#2563eb"/>
    <path d="M68 101 L90 47 L112 101 L90 90 Z" fill="#eff6ff"/>
    <path d="M90 22 V5 M90 142 V159 M35 82 H18 M162 82 H145" stroke="#60a5fa" stroke-width="7" stroke-linecap="round"/>
  </g>
  <text x="345" y="165" font-family="Segoe UI, Arial, sans-serif" font-size="84" font-weight="700" letter-spacing="2" fill="#f8fafc">CLEAR <tspan fill="#60a5fa">MIRROR</tspan></text>
  <text x="350" y="230" font-family="Segoe UI, Arial, sans-serif" font-size="30" letter-spacing="3" fill="#93c5fd">A CLEAR-EYED ADVISOR FOR AI AGENTS</text>
  <text x="800" y="354" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="600" fill="#e2e8f0">Challenge assumptions. Expose blind spots. Leave with a plan.</text>
  <path d="M165 405 H1435" stroke="url(#beam)" stroke-width="3"/>
  <g transform="translate(140 470)">
    <rect width="380" height="170" rx="24" fill="url(#card)" stroke="#2563eb" stroke-width="3"/>
    <text x="34" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#60a5fa">01</text>
    <text x="34" y="103" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="700" fill="#f8fafc">REMEMBER</text>
    <text x="34" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#cbd5e1">context, facts, constraints</text>
  </g>
  <path d="M550 555 H625" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/><path d="M615 545 L632 555 L615 565" fill="none" stroke="#60a5fa" stroke-width="4"/>
  <g transform="translate(610 470)">
    <rect width="380" height="170" rx="24" fill="url(#card)" stroke="#3b82f6" stroke-width="3"/>
    <text x="34" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#60a5fa">02</text>
    <text x="34" y="103" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="700" fill="#f8fafc">CREATE</text>
    <text x="34" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#cbd5e1">intent, tools, useful output</text>
  </g>
  <path d="M1020 555 H1095" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/><path d="M1085 545 L1102 555 L1085 565" fill="none" stroke="#60a5fa" stroke-width="4"/>
  <g transform="translate(1080 470)">
    <rect width="380" height="170" rx="24" fill="url(#card)" stroke="#60a5fa" stroke-width="3"/>
    <text x="34" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#60a5fa">03</text>
    <text x="34" y="103" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="700" fill="#f8fafc">VERIFY</text>
    <text x="34" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#cbd5e1">evidence, risks, next step</text>
  </g>
  <text x="800" y="790" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" letter-spacing="2" fill="#94a3b8">DIRECT FEEDBACK · STRATEGIC CLARITY · CONCRETE ACTION</text>
</svg>
