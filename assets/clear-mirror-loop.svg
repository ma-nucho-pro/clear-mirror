<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Ciclo de Clear Mirror</title>
  <desc id="desc">Clear Mirror recupera contexto, pasa por jueces de preflight, delega la ejecución, revisa hitos, repara y verifica antes de entregar.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07152c"/>
      <stop offset="1" stop-color="#182d52"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#245c87"/>
      <stop offset="1" stop-color="#183965"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity=".35"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#93c5fd"/>
    </marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#f3c969"/>
    </marker>
    <style>
      .ui { font-family: Inter, Segoe UI, Arial, sans-serif; }
      .title { font-size: 42px; font-weight: 750; fill: #f8fbff; }
      .subtitle { font-size: 20px; fill: #b7c9e4; }
      .label { font-size: 21px; font-weight: 700; fill: #f8fbff; }
      .body { font-size: 16px; fill: #bed0e8; }
      .small { font-size: 15px; fill: #a6bad8; }
    </style>
  </defs>
  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <circle cx="1450" cy="120" r="230" fill="#4b86d7" opacity=".13"/>
  <circle cx="120" cy="820" r="260" fill="#0e7490" opacity=".12"/>

  <g class="ui">
    <text x="86" y="92" class="title">Clear Mirror v2 · judge-gated orchestration</text>
    <text x="86" y="130" class="subtitle">Recover. Delegate. Review. Repair. Verify. Deliver.</text>

    <g filter="url(#shadow)">
      <rect x="82" y="230" width="210" height="150" rx="24" fill="#183965" stroke="#75a9e4" stroke-width="2"/>
      <rect x="332" y="230" width="250" height="150" rx="24" fill="url(#gate)" stroke="#93c5fd" stroke-width="2"/>
      <rect x="622" y="230" width="210" height="150" rx="24" fill="#183965" stroke="#75a9e4" stroke-width="2"/>
      <rect x="872" y="230" width="210" height="150" rx="24" fill="#183965" stroke="#75a9e4" stroke-width="2"/>
      <rect x="1122" y="230" width="210" height="150" rx="24" fill="#183965" stroke="#75a9e4" stroke-width="2"/>
      <rect x="1372" y="230" width="146" height="150" rx="24" fill="#214a48" stroke="#8fd6b7" stroke-width="2"/>
    </g>

    <path d="M292 305 H332" fill="none" stroke="#93c5fd" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M582 305 H622" fill="none" stroke="#93c5fd" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M832 305 H872" fill="none" stroke="#93c5fd" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M1082 305 H1122" fill="none" stroke="#93c5fd" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M1332 305 H1372" fill="none" stroke="#8fd6b7" stroke-width="4" marker-end="url(#arrow)"/>

    <text x="187" y="280" class="label" text-anchor="middle">Contexto</text>
    <text x="187" y="313" class="body" text-anchor="middle">request + fuentes</text>
    <text x="187" y="343" class="body" text-anchor="middle">requirements</text>
    <text x="457" y="274" class="label" text-anchor="middle">Preflight</text>
    <text x="457" y="307" class="body" text-anchor="middle">cobertura</text>
    <text x="457" y="335" class="body" text-anchor="middle">+ corrección</text>
    <text x="727" y="280" class="label" text-anchor="middle">Delegación</text>
    <text x="727" y="313" class="body" text-anchor="middle">tareas acotadas</text>
    <text x="727" y="343" class="body" text-anchor="middle">subagentes reales</text>
    <text x="977" y="280" class="label" text-anchor="middle">Milestone</text>
    <text x="977" y="313" class="body" text-anchor="middle">artefacto</text>
    <text x="977" y="343" class="body" text-anchor="middle">+ evidencia</text>
    <text x="1227" y="280" class="label" text-anchor="middle">Revisión</text>
    <text x="1227" y="313" class="body" text-anchor="middle">defecto →</text>
    <text x="1227" y="343" class="body" text-anchor="middle">reparar + retestar</text>
    <text x="1445" y="280" class="label" text-anchor="middle">Entrega</text>
    <text x="1445" y="313" class="body" text-anchor="middle">final</text>
    <text x="1445" y="343" class="body" text-anchor="middle">verificada</text>

    <path d="M1227 380 V485 H900 V540" fill="none" stroke="#f3c969" stroke-width="4" marker-end="url(#arrowAmber)"/>
    <g filter="url(#shadow)">
      <rect x="575" y="540" width="650" height="118" rx="24" fill="#3e3220" stroke="#f3c969" stroke-width="3"/>
    </g>
    <text x="900" y="584" class="label" text-anchor="middle">Reparar · retestar · renovar revisión</text>
    <text x="900" y="620" class="body" text-anchor="middle">los cambios invalidan aprobaciones afectadas</text>

    <g filter="url(#shadow)">
      <rect x="82" y="540" width="420" height="118" rx="24" fill="#271f3b" stroke="#b18de7" stroke-width="2"/>
    </g>
    <text x="292" y="584" class="label" text-anchor="middle">Gate estricto</text>
    <text x="292" y="620" class="body" text-anchor="middle">faltan jueces/evidencia → BLOCKED</text>

    <path d="M575 599 H502" fill="none" stroke="#f3c969" stroke-width="3"/>
    <path d="M1225 599 H1325 V485 H1445 V380" fill="none" stroke="#8fd6b7" stroke-width="3" stroke-dasharray="10 10" marker-end="url(#arrow)"/>
    <text x="800" y="748" class="small" text-anchor="middle">El checker valida la coherencia de los registros; el host debe autenticar jueces reales, evidencia y orden de gates.</text>
    <text x="800" y="786" class="small" text-anchor="middle">No promete perfección: entrega sólo cuando la barra pedida y los criterios observables pasan.</text>
  </g>
</svg>
