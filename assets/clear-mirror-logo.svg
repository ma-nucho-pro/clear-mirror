<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Clear Mirror logo</title>
  <desc id="desc">A blue and white reflective mark inside a dark circle, with the words Clear Mirror.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.55" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#93c5fd"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#bg)" stroke="#1e3a8a" stroke-width="8"/>
  <circle cx="256" cy="214" r="145" fill="#020617" stroke="#1e293b" stroke-width="14"/>
  <path d="M256 69 A145 145 0 0 1 256 359 L256 214 Z" fill="url(#blue)" opacity=".9"/>
  <path d="M256 83 A131 131 0 0 0 256 345" fill="none" stroke="#dbeafe" stroke-width="5" opacity=".9"/>
  <path d="M256 83 A131 131 0 0 1 256 345" fill="none" stroke="#60a5fa" stroke-width="5" opacity=".75"/>
  <path d="M197 265 L256 118 L315 265 L256 236 Z" fill="url(#shine)" filter="url(#glow)"/>
  <path d="M215 270 L256 164 L297 270 L256 250 Z" fill="#2563eb" opacity=".96"/>
  <path d="M256 108 L256 62 M256 366 L256 412" stroke="#60a5fa" stroke-width="12" stroke-linecap="round"/>
  <path d="M150 214 L105 214 M407 214 L362 214" stroke="#60a5fa" stroke-width="12" stroke-linecap="round"/>
  <circle cx="256" cy="214" r="7" fill="#eff6ff"/>
  <text x="256" y="430" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="5" fill="#f8fafc">CLEAR <tspan fill="#60a5fa">MIRROR</tspan></text>
</svg>
